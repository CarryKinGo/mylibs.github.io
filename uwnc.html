<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>UWNC GetLoginUserInfo POC</title>
  <style>
    body { font-family: monospace; padding: 12px; }
    button { padding: 10px 14px; }
    pre { white-space: pre-wrap; word-break: break-word; background: #111; color: #0f0; padding: 12px; }
  </style>
</head>
<body>
  <h3>UWNC.callAndroid → GetLoginUserInfo</h3>
  <button onclick="callGetLoginUserInfo()">Call GetLoginUserInfo</button>
  <pre id="log"></pre>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) { logEl.textContent += msg + "\n"; }

    // 不要覆盖 UWNC（如果注入存在就复用）
    if (!window.UWNC) window.UWNC = {};

    // Android 会执行：javascript:UWNC.callH5(<NativeBean JSON>)
    window.UWNC.callH5 = function (nativeBean) {
      log("[callH5] nativeBean=");
      log(JSON.stringify(nativeBean, null, 2));

      // NativeBean 字段：wcmd / wparams / callbackNcmd
      if (nativeBean && nativeBean.wcmd === "cb_GetLoginUserInfo") {
        log("[GetLoginUserInfo] wparams=");
        try {
          log(JSON.stringify(JSON.parse(nativeBean.wparams), null, 2));
        } catch (e) {
          log(String(nativeBean.wparams));
        }
      }
    };

    function callGetLoginUserInfo() {
      const payload = {
        ncmd: "GetLoginUserInfo",
        callbackWcmd: "cb_GetLoginUserInfo",
        nparams: {}
      };

      const json = JSON.stringify(payload);
      log("[send] " + json);

      if (!window.UWNC || typeof window.UWNC.callAndroid !== "function") {
        log("[error] UWNC.callAndroid not found (must run inside BPWebView/UWNCWebActivity).");
        return;
      }
      window.UWNC.callAndroid(json);
    }
  </script>
</body>
</html>
