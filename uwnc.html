<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>UWNC GetLoginUserInfo POC</title>
  <style>
    body { font-family: monospace; padding: 12px; }
    button { padding: 10px 14px; }
    pre { white-space: pre-wrap; word-break: break-word; background: #111; color: #0f0; padding: 12px; }
  </style>
</head>
<body>
  <h3>UWNC.callAndroid → GetLoginUserInfo</h3>
  <button onclick="callGetLoginUserInfo()">Call GetLoginUserInfo</button>
  <pre id="log"></pre>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) { logEl.textContent += msg + "\n"; }

    // 关键：Android 会执行 javascript:UWNC.callH5(<NativeBean JSON>)
    // 所以 H5 必须实现 UWNC.callH5
    window.UWNC = window.UWNC || {};

    UWNC.callH5 = function (nativeBean) {
      // nativeBean 可能是对象，也可能是 JSON 字符串（取决于 loadUrl 拼接后的解析方式）
      let obj = nativeBean;
      try { if (typeof nativeBean === "string") obj = JSON.parse(nativeBean); } catch (e) {}

      log("[callH5] raw:");
      log(JSON.stringify(obj, null, 2));

      // NativeBean: { wcmd, wparams, callbackNcmd }
      const wcmd = obj && obj.wcmd;
      const wparams = obj && obj.wparams;

      if (wcmd === "cb_GetLoginUserInfo") {
        log("[GetLoginUserInfo] wparams:");
        try { log(JSON.stringify(JSON.parse(wparams), null, 2)); }
        catch (e) { log(String(wparams)); }
      }
    };

    function callGetLoginUserInfo() {
      const payload = {
        ncmd: "GetLoginUserInfo",
        callbackWcmd: "cb_GetLoginUserInfo",
        nparams: {}
      };
      const json = JSON.stringify(payload);
      log("[send] " + json);

      if (!UWNC.callAndroid || typeof UWNC.callAndroid !== "function") {
        log("[error] UWNC.callAndroid not found. Must run inside BPWebView (UWNCWebActivity).");
        return;
      }
      UWNC.callAndroid(json);
    }
  </script>
</body>
</html>
