<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name='viewport'
        content='width=device-width, target-densitydpi=device-dpi, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no' />
</head>

<body>
    <div id="content">webview</div>
    <script>
        function getUserInfo() {
            // 防御性检查 + 错误处理
            try {
                if (window.HeytapJsApi && typeof window.HeytapJsApi.getUserInfoSync === 'function') {
                    const userInfo = window.HeytapJsApi.getUserInfoSync();
                    console.log("用户信息:", userInfo);
                    alert(JSON.stringify(userInfo));
                } else {
                    console.warn("接口未就绪，延迟重试...");
                    setTimeout(getUserInfo, 500); // 延迟重试
                }
            } catch (error) {
                alert("调用失败: " + error.message);
            }
        }

        // 启动检查
        document.addEventListener("DOMContentLoaded", function () {
            getUserInfo();
        });
    </script>

</body>

</html>
